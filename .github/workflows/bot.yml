name: Bot de ofertas

on:
  schedule:
    # Cada hora de 10:00 a 21:00 hora de CDMX (16:00 a 03:00 UTC)
    - cron: "0 16-23 * * *"
    - cron: "0 0-3 * * *"
  workflow_dispatch: {}   # boton "Run workflow" para publicar una ya

permissions:
  contents: write

concurrency:
  group: bot-ofertas
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar una oferta
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: "@loquetodohombrenecesita7"
        run: python bot.py

      - name: Guardar que ya se publico
        run: |
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          git add ofertas.csv
          if ! git diff --cached --quiet; then
            git commit -m "Oferta publicada"
            git pull --rebase --quiet || true
            git push
          fi
