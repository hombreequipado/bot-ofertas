name: Bot de ofertas

on:
  schedule:
    # Cada 15 minutos de 8:00 a 23:00 hora de CDMX (14:00 a 05:00 UTC)
    - cron: "*/15 14-23 * * *"
    - cron: "*/15 0-4 * * *"
  workflow_dispatch: {}   # boton "Run workflow" para probar a mano

permissions:
  contents: write

concurrency:
  group: bot-ofertas
  cancel-in-progress: false

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ronda del bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: python bot.py

      - name: Guardar el estado
        if: always()
        run: |
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          git add estado.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Estado del bot"
            git pull --rebase --quiet || true
            git push
          fi
